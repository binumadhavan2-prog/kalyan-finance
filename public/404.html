<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kalyan Finance</title>
    <!--
      GitHub Pages has no server-side rewrite, so a deep link like
      /kalyan-finance/about is a real 404 — there is no about.html. Pages serves
      this file for any unknown path; it rewrites the requested path into a query
      string and bounces to the app's index, where the small script in index.html
      restores it and hands it to the router. Standard spa-github-pages trick.

      pathSegmentsToKeep = 1 keeps the /<repo>/ project-page prefix. On a custom
      domain or user page served at the root, set it to 0.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
