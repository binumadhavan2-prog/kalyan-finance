<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kalyan Finance - business finance, personal finance assistance and short-term financial support for individuals and businesses." />
    <title>Kalyan Finance</title>
    <meta name="theme-color" content="#3B246B" />

    <!-- The splash covers the gap before the bundle runs, so its markup, styles
         and images all have to be here rather than in the app. -->
    <link rel="preload" as="image" href="/logo-shield.png" />
    <link rel="preload" as="image" href="/logo-crown.png" />
    <style>
      /* Same intro as the masthead mark, played large: the shield spins in from
         edge-on and the crown drops onto it.

         The crown landing is the beat the whole thing is built around. On
         impact the ground deepens, an accent bloom opens behind the mark,
         sparks lift off it and a pool of light settles underneath — the mark
         is then held in that state before the screen clears.

         Dismissal is CSS, not script. If the bundle fails or JS is off, a
         JS-driven splash would sit there covering a working site forever; this
         one always clears itself, and main.jsx only removes the dead node. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        /* --primary, --ink, --ink-invert, --primary-soft and --accent, hard
           coded because index.css has not loaded at this point. Keep them in
           step with :root. */
        background: #211A2E;
        --accent: #8B5CF6;
        --settle: 1.75s; /* the moment the crown lands */
        animation:
          splash-settle 0.9s ease-out 1.7s both,
          splash-out 0.5s ease 3s both;
      }

      #splash .splash__stage {
        position: relative;
        width: clamp(5rem, 18vw, 7.5rem);
        aspect-ratio: 1;
        perspective: 600px;
      }

      #splash .splash__mark {
        position: absolute;
        inset: 0;
      }

      #splash img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #splash .splash__shield {
        animation: splash-spin 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }

      #splash .splash__crown {
        animation: splash-crown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1s both;
      }

      /* --- the settle --- */

      /* Bloom behind the mark. Sits under it so the logo edge stays crisp. */
      #splash .splash__glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 340%;
        aspect-ratio: 1;
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(200, 176, 253, 0.55) 0%,
          rgba(139, 92, 246, 0.28) 22%,
          rgba(139, 92, 246, 0.08) 42%,
          rgba(139, 92, 246, 0) 68%
        );
        animation-name: splash-glow;
        animation-duration: 1.5s;
        animation-timing-function: ease-out;
        animation-delay: var(--settle, 1.75s);
        animation-fill-mode: both;
      }

      /* The mark itself picks up the bloom, which is what actually reads as
         the mark catching light rather than a haze parked behind a flat logo. */
      #splash .splash__mark {
        animation-name: splash-lit;
        animation-duration: 1.2s;
        animation-timing-function: ease-out;
        animation-delay: var(--settle, 1.75s);
        animation-fill-mode: both;
      }

      /* The pool of light the shield stands in. */
      #splash .splash__floor {
        position: absolute;
        left: 50%;
        bottom: -14%;
        width: 190%;
        height: 22%;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(139, 92, 246, 0.5) 0%,
          rgba(139, 92, 246, 0.1) 42%,
          rgba(139, 92, 246, 0) 70%
        );
        filter: blur(3px);
        animation-name: splash-floor;
        animation-duration: 1s;
        animation-timing-function: ease-out;
        animation-delay: var(--settle, 1.75s);
        animation-fill-mode: both;
      }

      #splash .splash__sparks {
        position: absolute;
        inset: -60% -120% 0;
        pointer-events: none;
      }

      #splash .splash__sparks span {
        position: absolute;
        left: 50%;
        bottom: 8%;
        width: var(--s, 3px);
        height: var(--s, 3px);
        margin-left: var(--x, 0);
        border-radius: 50%;
        background: #e6dcfd;
        box-shadow: 0 0 8px 2px rgba(139, 92, 246, 0.85);
        animation-name: splash-spark;
        animation-duration: 1.6s;
        animation-timing-function: ease-out;
        animation-delay: var(--d, 1.8s);
        animation-fill-mode: both;
      }

      #splash .splash__name,
      #splash .splash__tagline {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        animation: splash-name 0.5s ease both;
      }

      #splash .splash__name {
        font-size: clamp(1.5rem, 5vw, 2rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #ffffff;
        animation-delay: 1.15s;
      }

      #splash .splash__tagline {
        margin-top: -0.5rem;
        font-size: clamp(1.125rem, 4vw, 1.5rem);
        font-weight: 400;
        line-height: 1;
        color: #a196b8;
        animation-delay: 1.35s;
      }

      @keyframes splash-spin {
        from { transform: rotateY(-90deg); }
        to { transform: rotateY(360deg); }
      }

      @keyframes splash-crown {
        from { transform: translateY(-60%); opacity: 0; }
        35% { opacity: 1; }
        to { transform: translateY(0); opacity: 1; }
      }

      /* The deep ink holds through the spin and the drop so the accent reads
         against it, then the settle lifts to the masthead's primary — the
         screen the splash clears into is already that colour at the top. */
      @keyframes splash-settle {
        from { background-color: #211A2E; }
        to { background-color: #3B246B; }
      }

      @keyframes splash-glow {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
        100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
      }

      @keyframes splash-lit {
        0%   { filter: none; }
        20%  { filter: drop-shadow(0 0 22px rgba(200, 176, 253, 0.95)); }
        100% { filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.6)); }
      }

      @keyframes splash-floor {
        0%   { opacity: 0; transform: translateX(-50%) scaleX(0.5); }
        45%  { opacity: 1; }
        100% { opacity: 0.75; transform: translateX(-50%) scaleX(1); }
      }

      @keyframes splash-spark {
        0%   { opacity: 0; transform: translateY(0) scale(0.4); }
        15%  { opacity: 1; transform: translateY(calc(var(--rise, -100px) * 0.15)) scale(1); }
        100% { opacity: 0; transform: translateY(var(--rise, -100px)) scale(0.3); }
      }

      @keyframes splash-name {
        from { opacity: 0; transform: translateY(0.375rem); }
        to { opacity: 1; transform: none; }
      }

      @keyframes splash-out {
        to { opacity: 0; visibility: hidden; }
      }

      /* No spin, no drop, no sparks — the settled frame is shown outright and
         the screen clears almost at once. */
      @media (prefers-reduced-motion: reduce) {
        #splash {
          background: #3B246B;
          animation: splash-out 0.4s ease 0.6s both;
        }

        #splash .splash__shield,
        #splash .splash__crown,
        #splash .splash__name,
        #splash .splash__tagline {
          animation: none;
        }

        #splash .splash__glow {
          animation: none;
          opacity: 0.85;
          transform: translate(-50%, -50%);
        }

        #splash .splash__mark {
          animation: none;
          filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.6));
        }

        #splash .splash__floor {
          animation: none;
          opacity: 0.75;
          transform: translateX(-50%);
        }

        #splash .splash__sparks { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Kalyan Finance">
      <div class="splash__stage">
        <div class="splash__glow" aria-hidden="true"></div>
        <div class="splash__mark">
          <img class="splash__shield" src="/logo-shield.png" alt="" width="512" height="512" />
          <img class="splash__crown" src="/logo-crown.png" alt="" width="512" height="512" />
        </div>
        <div class="splash__floor" aria-hidden="true"></div>
        <!-- Sparks are hand-placed rather than generated: the splash has to
             work before any script runs. --d staggers them off the impact. -->
        <div class="splash__sparks" aria-hidden="true">
          <span style="--x: -128px; --s: 3px; --d: 1.78s; --rise: -150px"></span>
          <span style="--x: -96px;  --s: 2px; --d: 1.92s; --rise: -104px"></span>
          <span style="--x: -74px;  --s: 4px; --d: 1.72s; --rise: -186px"></span>
          <span style="--x: -52px;  --s: 2px; --d: 2.05s; --rise: -88px"></span>
          <span style="--x: -28px;  --s: 3px; --d: 1.85s; --rise: -160px"></span>
          <span style="--x: 18px;   --s: 2px; --d: 2.14s; --rise: -112px"></span>
          <span style="--x: 44px;   --s: 4px; --d: 1.76s; --rise: -174px"></span>
          <span style="--x: 68px;   --s: 2px; --d: 1.98s; --rise: -96px"></span>
          <span style="--x: 92px;   --s: 3px; --d: 1.82s; --rise: -142px"></span>
          <span style="--x: 132px;  --s: 2px; --d: 2.1s;  --rise: -120px"></span>
        </div>
      </div>
      <p class="splash__name">Kalyan Finance</p>
      <p class="splash__tagline">Building Better Futures Together</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
